        { from: "Chung Jin", to: "The Heavenly Demon", label: "Arc 7 Duel & Great Reversal", color: "#e06c75" },
        { from: "Chung Jin", to: "Baek Cheon", label: "Oak Stick Tough Love", color: "#e06c75" },
        { from: "Chung Jin", to: "Yu Iseol", label: "Sword-Intent Sparring", color: "#e06c75" },
        { from: "Chung Jin", to: "Mount Hua Plum Blossom Sect", label: "Rebuilds from Mud & Debt", color: "#e06c75" },
        { from: "Daesung", to: "Chung Jin", label: "Filial Honor & Fatherly Bond", color: "#e5c07b" },
        { from: "Yeon", to: "Chung Jin", label: "Hearth Porridge & Moral Anchor", color: "#e5c07b" },
        { from: "Uncle Kang", to: "Chung Jin", label: "Synthetic Execution in Ch. 6", color: "#61afef" },
        { from: "Cousin Bao", to: "Chung Jin", label: "Tamed Bully -> Loyal Pack-Mule", color: "#e5c07b" },

        // Faction clashes & dual reality
        { from: "Mount Hua Plum Blossom Sect", to: "Southern Edge Sect (The Usurpers)", label: "Humiliates Usurpers in Arc 2", color: "#e06c75" },
        { from: "Mount Hua Plum Blossom Sect", to: "Imperial Academies & Central Dynasty", label: "Tournament Infiltration", color: "#61afef" },
        { from: "Imperial Academies & Central Dynasty", to: "Moon Sovereignty", label: "Collaborator Puppet & Compute Culling", color: "#c678dd" },
        { from: "Demon Sacred Cult", to: "Moon Sovereignty", label: "Atmospheric Umbrella vs Sky Laser", color: "#c678dd" },
        { from: "Moon Sovereignty", to: "The Primary AI (Moon Sovereign)", label: "Central Neural Core", color: "#c678dd" },
        { from: "Qi as Non-Computability", to: "The Primary AI (Moon Sovereign)", label: "Algorithmic Blindspot", color: "#98c379" },
        { from: "The Death Note Sky Laser", to: "Reinforcement Learning Camps", label: "Orbital Enforcer", color: "#61afef" },

        // Cognitive Architecture edges
        { from: "00_The_Inner_Council_Protocol", to: "Seat_01_Surprise_The_Scout", label: "w=1.45", color: "#f0932b" },
        { from: "00_The_Inner_Council_Protocol", to: "Seat_02_Heat_The_Blazing_Sun", label: "w=1.80", color: "#e5c07b" },
        { from: "00_The_Inner_Council_Protocol", to: "Seat_03_Cold_The_Obsidian_Edge", label: "w=1.65", color: "#61afef" },
        { from: "00_The_Inner_Council_Protocol", to: "Seat_04_Truth_The_Radiant_Mirror", label: "w=1.75", color: "#98c379" },
        { from: "00_The_Inner_Council_Protocol", to: "Seat_05_Amygdala_The_Feral_Wolf", label: "w=1.95", color: "#e06c75" },
        { from: "00_The_Inner_Council_Protocol", to: "Seat_06_Trickster_The_Reigen_Abacus", label: "w=1.90", color: "#e5c07b" },
        { from: "00_The_Inner_Council_Protocol", to: "Self_Model_and_Preferences", label: "Core Persona", color: "#c678dd" }
      ]
    };

    // State
    let zoom = 0.38;
    let panX = 1100;
    let panY = 650;
    let isDragging = false;
    let startX, startY;
    let activeCategory = "all";
    let activeSearch = "";

    const world = document.getElementById("canvasWorld");
    const viewport = document.getElementById("canvasViewport");
    const nodesLayer = document.getElementById("nodesLayer");
    const groupsLayer = document.getElementById("groupsLayer");
    const edgesSvg = document.getElementById("edgesSvg");
    const zoomPercent = document.getElementById("zoomPercent");
    const zoomLevelName = document.getElementById("zoomLevelName");

    // Initialize Layout
    function initCanvas() {
      // 1. Render Groups
      groupsLayer.innerHTML = VAULT_DATA.groups.map(g => `
        <div id="${g.id}" class="absolute rounded-3xl p-6 select-none pointer-events-none" style="
          left: ${g.x}px; top: ${g.y}px; width: ${g.w}px; height: ${g.h}px;
          background: ${g.color};
        ">
          <div class="inline-block px-4 py-1.5 rounded-full text-xs font-mono font-bold tracking-wider" style="color: ${g.borderCol}; background: rgba(0,0,0,0.5);">
            ${g.label}
          </div>
        </div>
      `).join("");

      // 2. Render Nodes
      nodesLayer.innerHTML = VAULT_DATA.nodes.map(n => {
        const catBadgeColors = {
          character: "bg-brand-plum/20 text-brand-plum",
          faction: "bg-brand-sky/20 text-brand-sky",
          lore: "bg-brand-emerald/20 text-brand-emerald",
          secret: "bg-brand-gold/20 text-brand-gold",
          arc: "bg-brand-gold/20 text-brand-gold",
          council: "bg-brand-purple/20 text-brand-purple"
        };
        const badgeCol = catBadgeColors[n.category] || "bg-white/10 text-white";

        return `
          <div id="node-${encodeURIComponent(n.id)}" onclick="openNode('${n.id}')"
            class="node-card group absolute elevated-paper rounded-2xl p-5 cursor-pointer flex flex-col justify-between"
            data-category="${n.category}"
            style="left: ${n.x}px; top: ${n.y}px; width: ${n.w}px; height: ${n.h}px; min-height: 160px;">
            
            <div>
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="text-[10px] font-mono px-2 py-0.5 rounded-full uppercase tracking-wider ${badgeCol}">
                  ${n.category}
                </span>
                <span class="text-[11px] font-mono text-gray-400 truncate max-w-[170px]">${n.role || ""}</span>
              </div>

              <h3 class="text-base font-bold text-white tracking-tight group-hover:text-brand-plum transition font-serif">
                ${n.title}
              </h3>

              ${n.archetype ? `<p class="text-[11px] text-gray-400 font-mono mt-0.5">${n.archetype}</p>` : ''}
              
              <p class="text-xs text-gray-300 mt-2 line-clamp-3 leading-relaxed">
                ${n.desc}
              </p>
            </div>

            <!-- Hover On Appear More Info (User Rule) -->
            <div class="hover-info mt-3 pt-2.5 flex items-center justify-between text-[11px] text-brand-plum">
              <span class="flex items-center gap-1 font-mono"><i data-lucide="compass" class="w-3.5 h-3.5"></i> Inspect Dossier</span>
              <span class="text-gray-400 font-mono">${n.links ? n.links.length + ' Links' : ''}</span>
            </div>
          </div>
        `;
      }).join("");

      // 3. Render Edges
      renderEdges();

      // 4. Center View
      updateTransform();
      lucide.createIcons();
    }

    function renderEdges() {
      const paths = VAULT_DATA.edges.map(e => {
        const fromEl = VAULT_DATA.nodes.find(n => n.id === e.from);
        const toEl = VAULT_DATA.nodes.find(n => n.id === e.to);
        if (!fromEl || !toEl) return "";

        const x1 = fromEl.x + fromEl.w;
        const y1 = fromEl.y + (fromEl.h / 2);
        const x2 = toEl.x;
        const y2 = toEl.y + (toEl.h / 2);

        const dx = (x2 - x1) * 0.5;
        const cx1 = x1 + dx;
        const cy1 = y1;
        const cx2 = x2 - dx;
        const cy2 = y2;

        const midX = (x1 + x2) / 2;
        const midY = (y1 + y2) / 2;

        return `
          <g class="edge-group">
            <path d="M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}" 
              fill="none" stroke="${e.color || '#4b5563'}" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="${e.label ? 'none' : '4 4'}" />
            ${e.label ? `
              <rect x="${midX - 70}" y="${midY - 12}" width="140" height="24" rx="12" fill="rgba(11, 15, 25, 0.9)" />
              <text x="${midX}" y="${midY + 4}" text-anchor="middle" font-size="10" font-family="Inter, sans-serif" font-weight="500" fill="#d1d5db">
                ${e.label}
              </text>
            ` : ''}
          </g>
        `;
      }).join("");

      edgesSvg.innerHTML = paths;
    }

    // Transform Pan/Zoom
    function updateTransform() {
      world.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      zoomPercent.innerText = `${Math.round(zoom * 100)}%`;

      // Update Semantic Zoom Level Indicator
      if (zoom < 0.28) {
        zoomLevelName.innerText = "Macro View (World Clusters & 14-Arc Horizon)";
        zoomLevelName.className = "text-brand-gold font-medium";
      } else if (zoom < 0.75) {
        zoomLevelName.innerText = "Meso View (Entities, Factions & Systems)";
        zoomLevelName.className = "text-white font-medium";
      } else {
        zoomLevelName.innerText = "Micro View (Detailed Dossiers & Transclusions)";
        zoomLevelName.className = "text-brand-plum font-medium";
      }
    }

    function zoomBy(factor) {
      const newZoom = Math.min(Math.max(zoom * factor, 0.10), 2.2);
      const cx = viewport.clientWidth / 2;
      const cy = viewport.clientHeight / 2;
      panX = cx - (cx - panX) * (newZoom / zoom);
      panY = cy - (cy - panY) * (newZoom / zoom);
      zoom = newZoom;
      updateTransform();
    }

    function resetZoom() {
      zoom = 0.38;
      panX = viewport.clientWidth * 0.42;
      panY = viewport.clientHeight * 0.42;
      updateTransform();
    }

    // Viewport Drag / Mousewheel
    viewport.addEventListener('mousedown', e => {
      if (e.target.closest('.node-card') || e.target.closest('button') || e.target.closest('input')) return;
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => isDragging = false);

    viewport.addEventListener('wheel', e => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      const mouseX = e.clientX;
      const mouseY = e.clientY;

      const newZoom = Math.min(Math.max(zoom * zoomFactor, 0.10), 2.2);
      panX = mouseX - (mouseX - panX) * (newZoom / zoom);
      panY = mouseY - (mouseY - panY) * (newZoom / zoom);
      zoom = newZoom;
      updateTransform();
    }, { passive: false });

    // Category Filtering
    function filterCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-brand-plum', 'text-white');
        btn.classList.add('text-gray-300');
      });
      const activeBtn = document.getElementById(`btn-cat-${cat}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-brand-plum', 'text-white');
        activeBtn.classList.remove('text-gray-300');
      }

      applyFilters();
    }

    // Search
    function handleSearch(val) {
      activeSearch = val.toLowerCase().trim();
      applyFilters();
    }

    function applyFilters() {
      VAULT_DATA.nodes.forEach(n => {
        const el = document.getElementById(`node-${encodeURIComponent(n.id)}`);
        if (!el) return;

        const matchCat = (activeCategory === "all" || n.category === activeCategory);
        const matchSearch = (!activeSearch || 
          n.title.toLowerCase().includes(activeSearch) || 
          (n.desc && n.desc.toLowerCase().includes(activeSearch)) ||
          (n.role && n.role.toLowerCase().includes(activeSearch)) ||
          (n.archetype && n.archetype.toLowerCase().includes(activeSearch))
        );

        if (matchCat && matchSearch) {
          el.style.opacity = "1";
          el.style.filter = "none";
          el.style.pointerEvents = "auto";
        } else {
          el.style.opacity = "0.15";
          el.style.filter = "grayscale(80%)";
          el.style.pointerEvents = "none";
        }
      });
    }

    // Inspector Drawer
    function openNode(nodeId) {
      const n = VAULT_DATA.nodes.find(item => item.id === nodeId);
      if (!n) return;

      const drawer = document.getElementById("inspectorDrawer");
      document.getElementById("drawerTitle").innerText = n.title;
      document.getElementById("drawerBadge").innerText = n.category;
      document.getElementById("drawerStatus").innerText = n.role || "";

      // Quote
      const quoteEl = document.getElementById("drawerQuote");
      if (n.quote) {
        quoteEl.innerText = `"${n.quote}"`;
        quoteEl.classList.remove("hidden");
      } else {
        quoteEl.classList.add("hidden");
      }

      // Image
      const imgContainer = document.getElementById("drawerImageContainer");
      const imgEl = document.getElementById("drawerImage");
      const captionEl = document.getElementById("drawerImageCaption");
      if (n.image) {
        imgEl.src = n.image;
        captionEl.innerText = n.imageCaption || "";
        imgContainer.classList.remove("hidden");
      } else {
        imgContainer.classList.add("hidden");
      }

      // Metadata Pills
      const metaEl = document.getElementById("drawerMetadata");
      metaEl.innerHTML = `
        <span class="px-2.5 py-1 rounded-xl bg-white/5 text-gray-300 font-mono">ID: [[${n.id}]]</span>
        ${n.archetype ? `<span class="px-2.5 py-1 rounded-xl bg-brand-plum/10 text-brand-plum font-mono">${n.archetype}</span>` : ''}
      `;

      // Markdown Prose
      document.getElementById("drawerMarkdown").innerHTML = marked.parse(n.desc || "");

      // Links
      const linksEl = document.getElementById("drawerLinks");
      if (n.links && n.links.length > 0) {
        linksEl.innerHTML = n.links.map(l => `
          <button onclick="panToNode('${l}')" class="px-2.5 py-1 rounded-xl bg-white/10 hover:bg-brand-plum/20 hover:text-brand-plum text-gray-300 text-xs font-mono transition flex items-center gap-1">
            <i data-lucide="link" class="w-3 h-3"></i> [[${l}]]
          </button>
        `).join("");
      } else {
        linksEl.innerHTML = `<span class="text-xs text-gray-500 italic">No direct links</span>`;
      }

      drawer.classList.remove("translate-x-full");
      lucide.createIcons();
    }

    function closeDrawer() {
      document.getElementById("inspectorDrawer").classList.add("translate-x-full");
    }

    function panToNode(nodeId) {
      const n = VAULT_DATA.nodes.find(item => item.id === nodeId);
      if (!n) return;

      zoom = 0.85;
      panX = (viewport.clientWidth / 2) - (n.x + n.w / 2) * zoom;
      panY = (viewport.clientHeight / 2) - (n.y + n.h / 2) * zoom;
      updateTransform();
      openNode(nodeId);
    }

    // Boot
    window.addEventListener('DOMContentLoaded', () => {
      initCanvas();
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('zoom')) zoom = parseFloat(urlParams.get('zoom'));
      if (urlParams.has('panX')) panX = parseFloat(urlParams.get('panX'));
      if (urlParams.has('panY')) panY = parseFloat(urlParams.get('panY'));
      updateTransform();
    });
  </script>
</body>
