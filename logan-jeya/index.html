      /* Global Scrollbar Settings */
      html {
        scrollbar-width: thin;
        scrollbar-color: var(--border-color) var(--bg-color);
        scroll-behavior: smooth;
        text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
      }

      /* Desktop / Hover-Capable Devices */
      @media (hover: hover) and (pointer: fine) {
        /* Firefox: Hide thumb until hover */
        * {
            scrollbar-color: transparent var(--bg-color);
            transition: scrollbar-color 0.3s;
        }
        *:hover {
            scrollbar-color: var(--border-color) var(--bg-color);
        }

        /* WebKit Customization */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background-color: transparent;
            border-radius: 20px;
            border: 2px solid var(--bg-color);
            background-clip: content-box;
            transition: background-color 0.3s;
        }
        *:hover::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: var(--text-secondary-color);
        }
      }
      
      /* Font Smoothing & Global Reset for Crispness */
      body {

        font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
        -webkit-tap-highlight-color: transparent;

      /* Force crisp icons and vectors */

      /* Hardware acceleration for fixed elements to ensure smooth scrolling */

            max-width: none !important;

    <script>
      // Anti-flicker script
      (function() {
        const theme = localStorage.getItem('theme');
        const lastLightPalette = localStorage.getItem('lastLightPalette') || 'default-light';
        const lastDarkPalette = localStorage.getItem('lastDarkPalette') || 'default-dark';

        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', lastLightPalette);
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.setAttribute('data-theme', lastDarkPalette);
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
